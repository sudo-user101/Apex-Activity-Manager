name: Feature request
description: An idea for something Apex should do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation, e.g. "When my Mac gets slow in the afternoon, I can't tell which app started it."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like Apex to do
      description: How you imagine it working. Sketches and screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you handle it today
      description: What you do now (another app, Terminal, nothing), if anything.
  - type: input
    id: mac
    attributes:
      label: Your Mac and macOS version (optional)
      description: Some features depend on the hardware, e.g. fans or a battery.
      placeholder: "MacBook Pro (M3, 2023), macOS 15.1"
